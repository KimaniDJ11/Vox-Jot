name: Build Speech Runtimes

on:
  workflow_dispatch:
  push:
    paths:
      - "speech-runtime/**"
      - "scripts/build-speech-runtime.sh"
      - ".github/workflows/build-speech-runtime.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch_override: x86_64
            asset: speech-runtime-macos-x64.tar.gz
          - os: ubuntu-latest
            platform: linux
            arch_override: ""
            asset: speech-runtime-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            arch_override: ""
            asset: speech-runtime-windows-x64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build speech runtime (Unix)
        if: runner.os != 'Windows'
        env:
          SPEECH_RUNTIME_PYTHON: python3.11
          SPEECH_RUNTIME_ARCH: ${{ matrix.arch_override }}
        run: bash scripts/build-speech-runtime.sh

      - name: Build speech runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SPEECH_RUNTIME_PYTHON: python
          SPEECH_RUNTIME_ARCH: ${{ matrix.arch_override }}
        run: bash scripts/build-speech-runtime.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    name: Upload to v0.3.0-tts-models release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset_dir in artifacts/speech-runtime-*; do
            asset_name="$(basename "$asset_dir")"
            asset_file="$asset_dir/$asset_name"
            if [ -f "$asset_file" ]; then
              echo "Uploading $asset_name..."
              # Delete existing asset if present (idempotent re-runs)
              gh release delete-asset v0.3.0-tts-models "$asset_name" \
                -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
              gh release upload v0.3.0-tts-models "$asset_file" \
                -R "$GITHUB_REPOSITORY"
            fi
          done
