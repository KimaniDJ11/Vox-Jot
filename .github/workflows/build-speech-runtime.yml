name: Build Speech Runtimes

on:
  workflow_dispatch:
  push:
    paths:
      - "speech-runtime/**"
      - "scripts/build-speech-runtime.sh"
      - ".github/workflows/build-speech-runtime.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch_override: x86_64
            asset: speech-runtime-macos-x64.tar.gz
          - os: ubuntu-latest
            platform: linux
            arch_override: ""
            asset: speech-runtime-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            arch_override: ""
            asset: speech-runtime-windows-x64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build speech runtime (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPEECH_RUNTIME_PYTHON: python3.11
          SPEECH_RUNTIME_ARCH: ${{ matrix.arch_override }}
        run: bash scripts/build-speech-runtime.sh

      - name: Build speech runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPEECH_RUNTIME_PYTHON: python
          SPEECH_RUNTIME_ARCH: ${{ matrix.arch_override }}
        run: bash scripts/build-speech-runtime.sh

      - name: Verify runtime archive
        shell: bash
        run: |
          test -s "dist/${{ matrix.asset }}"
          archive_listing="$RUNNER_TEMP/${{ matrix.asset }}.files.txt"
          tar -tzf "dist/${{ matrix.asset }}" > "$archive_listing"
          grep -q 'THIRD_PARTY_NOTICES.txt' "$archive_listing"
          if grep -Eq '(^|/)(\._|__MACOSX)' "$archive_listing"; then
            echo "macOS metadata found in runtime archive" >&2
            exit 1
          fi

      - name: Distribution reminder
        shell: bash
        run: |
          echo "Validated ${{ matrix.asset }}."
          echo "Publish approved runtime artifacts with scripts/upload-speech-runtime-asset.sh; GitHub Releases are not a production distribution target."
