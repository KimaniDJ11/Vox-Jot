name: "Model License Compliance"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  model-license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate model licenses and notices
        run: bun run models:validate-licenses

      - name: Generate and verify application dependency notices
        run: bun run licenses:generate
