name: "Model License Compliance"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  model-license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate model licenses and notices
        run: bun run models:validate-licenses
