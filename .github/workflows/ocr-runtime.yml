name: "Publish OCR Runtime"

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload verified runtime archives to Hugging Face"
        required: true
        type: boolean
        default: true
      profile:
        description: "OCR runtime dependency profile"
        required: true
        type: choice
        default: all
        options:
          - all
          - transformers-vl
          - paddle

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-runtime:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            archive: ocr-runtime-linux-x64-all.tar.gz
          - os: windows-latest
            platform: windows
            arch: x64
            archive: ocr-runtime-windows-x64-all.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        shell: bash
        run: python -m pip install --upgrade "huggingface_hub[cli]"

      - name: Build OCR runtime archive
        shell: bash
        env:
          OCR_RUNTIME_PYTHON: python
          OCR_RUNTIME_PROFILE: ${{ inputs.profile }}
        run: bash scripts/build-ocr-runtime.sh

      - name: Verify OCR runtime archive
        shell: bash
        run: bash scripts/verify-ocr-runtime-archive.sh "dist/ocr-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.profile }}.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocr-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.profile }}
          path: |
            dist/ocr-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.profile }}.tar.gz
            dist/ocr-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.profile }}.tar.gz.sha256
          retention-days: 14

      - name: Upload to Hugging Face
        if: inputs.upload
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OCR_RUNTIME_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "HF_TOKEN GitHub secret is required to upload OCR runtime artifacts." >&2
            exit 1
          fi
          bash scripts/upload-ocr-runtime-to-hf.sh
