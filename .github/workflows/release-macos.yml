name: "Release macOS"

# GitHub Releases are BLOCKED for Vox Jot app distribution.
#
# This workflow is intentionally neutered. Do NOT restore the previous
# create-release / build / publish-to-Hugging-Face logic (it lives in git
# history). The GitHub-release distribution path is off-policy; use the local
# Cloudflare R2 + Gumroad + updater-feed distributor instead:
#
#   bun run release:local-mac -- <version>
#
# See CLAUDE.md / AGENTS.md "Production Distribution Policy".

on: workflow_dispatch

permissions: {}

jobs:
  blocked:
    name: GitHub release path is blocked
    runs-on: ubuntu-latest
    steps:
      - name: Fail with distribution policy
        run: |
          echo "::error::GitHub Releases are blocked for Vox Jot app distribution."
          echo "The 'Release macOS' GitHub Actions release path is intentionally disabled."
          echo ""
          echo "Use the local distributor instead:"
          echo "  bun run release:local-mac -- <version>"
          echo ""
          echo "See CLAUDE.md / AGENTS.md \"Production Distribution Policy\"."
          exit 1
