name: "Security"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install Rust security tools
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: Audit frontend dependencies
        run: bun audit

      - name: Enforce Rust advisory policy
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scan result is the gate. SARIF artifact upload is optional and
          # must not turn a clean scan into a failure when Actions storage is full.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
