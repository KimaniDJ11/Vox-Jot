[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "warn"

# Production advisory policy:
# - RustSec vulnerabilities remain hard failures unless explicitly listed below
#   as current transitive advisories with documented scope and no app-level
#   upgrade path.
# - Direct/workspace unmaintained or unsound advisories must be fixed, not ignored.
# - The exceptions below are only for current transitive advisories with no
#   app-level upgrade path after moving to Tauri 2.11 / wry 0.55 and removing
#   Vox Jot's direct gtk-layer-shell/gtk dependency.
# Revisit these exceptions when Tauri's Linux runtime moves off GTK3/WebKitGTK
# GTK3 bindings or when tauri-utils replaces urlpattern/rust-unic. GitHub
# Dependabot GHSA mirrors for these same blocked transitive advisories should be
# dismissed only with the matching rationale below.
ignore = [
  { id = "RUSTSEC-2024-0411", reason = "Transitive Tauri/tao Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0412", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0413", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0414", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0415", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0416", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0417", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0418", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0419", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0420", reason = "Transitive Tauri/wry Linux GTK3 binding; no app-level GTK4 migration path while shipping Tauri Linux." },
  { id = "RUSTSEC-2024-0429", reason = "Transitive Tauri/wry Linux glib 0.18 (GHSA-wrw7-89jp-8q8g); patched glib 0.20 is blocked by the GTK3 Tauri Linux stack." },
  { id = "RUSTSEC-2024-0370", reason = "Transitive proc-macro helper; not used by Vox Jot runtime code and no direct dependency remains to upgrade." },
  { id = "RUSTSEC-2024-0436", reason = "Transitive proc-macro helper; not used by Vox Jot runtime code and no direct dependency remains to upgrade." },
  { id = "RUSTSEC-2025-0075", reason = "Transitive tauri-utils urlpattern dependency; no app-level replacement path." },
  { id = "RUSTSEC-2025-0080", reason = "Transitive tauri-utils urlpattern dependency; no app-level replacement path." },
  { id = "RUSTSEC-2025-0081", reason = "Transitive tauri-utils urlpattern dependency; no app-level replacement path." },
  { id = "RUSTSEC-2025-0098", reason = "Transitive tauri-utils urlpattern dependency; no app-level replacement path." },
  { id = "RUSTSEC-2025-0100", reason = "Transitive tauri-utils urlpattern dependency; no app-level replacement path." },
  { id = "RUSTSEC-2026-0192", reason = "Transitive lopdf/pdf-extract font parser dependency; pdf-extract 0.12.0 and lopdf 0.42.0 are current, and replacing Vox Jot's PDF text extraction stack is not a drop-in patch." },
  { id = "RUSTSEC-2026-0194", reason = "Transitive Linux Wayland scanner proc-macro through tauri-plugin-clipboard-manager/arboard; wayland-scanner 0.31.10 is latest and still pins quick-xml 0.39, and this scanner consumes bundled protocol XML at build time rather than app/user data or macOS runtime input." },
  { id = "RUSTSEC-2026-0195", reason = "Transitive Linux Wayland scanner proc-macro through tauri-plugin-clipboard-manager/arboard; wayland-scanner 0.31.10 is latest and still pins quick-xml 0.39, and this scanner consumes bundled protocol XML at build time rather than app/user data or macOS runtime input." },
]
