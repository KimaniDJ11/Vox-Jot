[package]
name = "vox_jot"
version = "1.0.18"
description = "Vox Jot"
authors = ["Irie Dinamik", "cjpais"]
edition = "2021"
license = "MIT"
default-run = "vox_jot"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy", "ci-mock-transcription"))'] }

[features]
default = ["speech-runtime"]
speech-runtime = ["dep:transcribe-rs"]
ci-mock-transcription = []

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vox_jot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.11.1", features = [
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2.5.3"
tauri-plugin-store = "2.4.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "=2.5.0"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
sha2 = "0.11"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "4.0.0"
hound = "3.5.1"
log = "0.4.25"
env_filter = "2.0.0"
tokio = { version = "1.43.0", features = ["process"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.13", features = ["json", "stream", "blocking", "multipart", "query"] }
ureq = { version = "3.3", features = ["multipart"] }
tungstenite = "0.30.0"
dirs = "6"
futures-util = "0.3"
rustfft = "6.4.0"
nnnoiseless = { version = "0.5.2", default-features = false }
similar = "3"
strsim = "0.11.0"
uuid = { version = "1", features = ["v4"] }
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
pdf-extract = "0.12.0"
quick-xml = "0.42.0"
tar = "0.4.46"
flate2 = "1.0"
bzip2 = "0.6"
zip = "8.6"
handy-keys = "0.3.1"
ferrous-opencc = "0.4.0"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.7.0"
base64 = "0.23"
keyring-core = "1"
notify = "8"
notify-debouncer-full = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "multipart"] }
sentry = { version = "0.49.1", default-features = false, features = ["backtrace", "contexts", "native-tls", "panic", "reqwest"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows = { version = "0.62.2", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }
winreg = "0.56"
uiautomation = "0.25"
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx", "whisper-cpp", "whisper-metal"], optional = true }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = { version = "0.10", features = ["mac_os_10_8_features"] }
core-graphics = "0.25"
window-vibrancy = "0.8"
objc = "0.2"
# Loopback asset server for release builds (see src/asset_server.rs).
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx", "whisper-cpp"], optional = true }
png = "0.18"
# atspi is excluded until the Linux field monitor is implemented

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx", "whisper-cpp"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "time"] }

# crates.io 0.31.10 still pins vulnerable quick-xml 0.39.4. This public fork
# starts from the exact 0.31.10 release and applies only upstream's official
# quick-xml 0.41 bump, preserving compatibility with released Wayland clients.
[patch.crates-io]
wayland-scanner = { git = "https://github.com/KimaniDJ11/wayland-rs.git", rev = "1dfbcc66d7e3e4697be06101f4867fc1b351a14d" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
