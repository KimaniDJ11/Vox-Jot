<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.5" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#eef7ef"/>
    </linearGradient>
    <radialGradient id="voiceGlow" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#0f55a8" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#0f55a8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0f55a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jotGlow" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#d89a5c" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d89a5c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#14213b" flood-opacity="0.16"/>
    </filter>
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="760" height="520" fill="url(#paper)"/>
  <circle cx="158" cy="330" r="230" fill="url(#voiceGlow)"/>
  <circle cx="600" cy="320" r="210" fill="url(#jotGlow)"/>

  <path d="M 39 394 C 115 350, 133 264, 94 206 C 61 157, 74 94, 136 62" fill="none"
    stroke="#0f55a8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.42"/>
  <path d="M 706 126 C 646 161, 635 226, 675 276 C 710 319, 699 384, 629 438" fill="none"
    stroke="#d89a5c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.48"/>

  <g opacity="0.1" transform="translate(56 54) scale(0.84)">
    <path d="M89 78H215C247 78 273 104 273 136V164C273 196 247 222 215 222H100L48 253V136C48 104 73 78 89 78Z"
      stroke="#0f55a8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91 114H214" stroke="#0f55a8" stroke-width="18" stroke-linecap="round"/>
    <path d="M80 145H214" stroke="#0f55a8" stroke-width="18" stroke-linecap="round"/>
    <path d="M101 177H183" stroke="#0f55a8" stroke-width="18" stroke-linecap="round"/>
    <circle cx="214" cy="177" r="12" fill="#d89a5c"/>
  </g>

  <text x="380" y="90" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#121018"
    filter="url(#inkShadow)">
    Install Vox Jot
  </text>
  <text x="380" y="147" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#121018"
    filter="url(#inkShadow)">
    drag it into Applications
  </text>
  <text x="380" y="187" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
    font-size="16" font-weight="700" letter-spacing="0.4" fill="#41506c">
    Voice to text, ready from your menu bar
  </text>

  <g filter="url(#softShadow)" opacity="0.5">
    <rect x="140" y="272" width="154" height="154" rx="39" fill="#fffdf6"/>
    <rect x="503" y="272" width="154" height="154" rx="39" fill="#fffdf6"/>
  </g>

  <g opacity="0.92">
    <path d="M 302 338 C 323 302, 354 294, 382 321 C 413 352, 442 343, 463 310" fill="none"
      stroke="#0f55a8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 463 310 C 478 291, 497 287, 516 303 C 531 315, 545 318, 561 307" fill="none"
      stroke="#d89a5c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 544 304 L 570 301 L 558 325" fill="none"
      stroke="#d89a5c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="382" cy="321" r="7" fill="#d89a5c"/>
  </g>

  <text x="380" y="491" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="700" letter-spacing="0.5" fill="#6a5a4a">
    Website edition
  </text>
</svg>
